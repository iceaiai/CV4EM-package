[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "object-detection-segmentation"
version = "0.1.0"
description = "Microscopy image conversion, registration, and segmentation utilities"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "hyperspy",
    "scikit-image",
    "matplotlib",
    "pandas",
    "opencv-python",
]

[tool.setuptools.packages.find]
where = ["src"]
